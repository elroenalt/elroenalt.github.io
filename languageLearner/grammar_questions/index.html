<!DOCTYPE html>
<html>
<head>

<title>Grammar Questions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>ᚴᚴ</text></svg>">

<link rel="stylesheet" type="text/css" href="../main.css">
<link rel="stylesheet" type="text/css" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div id="Background">
</div>
<div id="Forground">
    <div id="KeyboardContainer"></div>
    <div class="container" id="ContainerCards">
        <div class="container"id="ContainerCardSettings">
            <div class="button" id="ContainerCardSettingsButtonMiddle" onclick="toggleKeyboard()">⌨️</div>
        </div>
        <div class="popUp"id="ContainerCard">
            <div id="infoQuestion">
                <div id="title" id="ViwerContainerTitle" onclick="openGrammarHTML()">
                </div>
                <div id="word_translated" id="ViwerContainerwordAndTranslate">
                </div>
            </div>
            <div id="solEnter">
                <table>
                    <tr>
                        <td></td>
                        <td><div>Singular</div></td>
                        <td><div>Plural</div></td>
                    </tr>
                    <tr>
                        <td><div>Nominative</div></td>
                        <td><input type="text" value="00"></td>
                        <td><input type="text" value="01"></td>
                    </tr>
                    <tr>
                        <td><div>Accusative</div></td>
                        <td><input type="text" value="10"></td>
                        <td><input type="text" value="11"></td>
                    </tr>
                    <tr>
                        <td><div>Genitive</div></td>
                        <td><input type="text" value="20"></td>
                        <td><input type="text" value="21"></td>
                    </tr>
                    <tr>
                        <td><div>Dative</div></td>
                        <td><input type="text" value="30"></td>
                        <td><input type="text" value="31"></td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="container"id="ContainerCardButtons">
            <div class="button" id="ContainerCardButtonLast" onclick="displayQuestion(curId-1)"><</div>
            <div class="button" id="ContainerCardButtonReveal" onclick="checkSol()">☐</div>
            <div class="button" id="ContainerCardButtonNext" onclick="displayQuestion(curId+1)">></div>
        </div>
    </div>
</div>
<script>
    const data = [
        ["strong adjective", "várr", "our", [["várr","váran","várs","várum","várir","vára","vára","várum"],["vár","vára","várar","vári","várar","várar","vára","várum"],["várt","várt","várs","váru","vár","vár","vára","várum"]],[[["SG."],["Masculine"],["Feminine"],["Neuter"]],[["Nom."],[false],[false],[false]],[["Acc."],[false],[false],[false]],[["Gen."],[false],[false],[false]],[["Dat."],[false],[false],[false]],[["PL."],["Masculine"],["Feminine"],["Neuter"]],[["Nom."],[false],[false],[false]],[["Acc."],[false],[false],[false]],[["Gen."],[false],[false],[false]],[["Dat."],[false],[false],[false]]]],
        ["strong adjective", "okkarr", "our two", [["okkarr","okkarn","okkars","okkurum","okkarir","okkara","okkara","okkurum"],["okkur","okkara","okkarar","okkari","okkarar","okkarar","okkara","okkurum"],["okkart","okkart","okkars","okkǫru","okkur","okkur","okkara","okkurum"]],[[["SG."],["Masculine"],["Feminine"],["Neuter"]],[["Nom."],[false],[false],[false]],[["Acc."],[false],[false],[false]],[["Gen."],[false],[false],[false]],[["Dat."],[false],[false],[false]],[["PL."],["Masculine"],["Feminine"],["Neuter"]],[["Nom."],[false],[false],[false]],[["Acc."],[false],[false],[false]],[["Gen."],[false],[false],[false]],[["Dat."],[false],[false],[false]]]],
        ["strong adjective", "yðvarr", "you'alls", [["yðvarr","yðvarn","yðvars","yðvurum","yðvarir","yðvara","yðvara","yðvurum"],["yðvur","yðvara","yðvarar","yðvari","yðvarar","yðvarar","yðvara","yðvurum"],["yðvart","yðvart","yðvars","yðvuru","yðvur","yðvur","yðvara","yðvurum"]],[[["SG."],["Masculine"],["Feminine"],["Neuter"]],[["Nom."],[false],[false],[false]],[["Acc."],[false],[false],[false]],[["Gen."],[false],[false],[false]],[["Dat."],[false],[false],[false]],[["PL."],["Masculine"],["Feminine"],["Neuter"]],[["Nom."],[false],[false],[false]],[["Acc."],[false],[false],[false]],[["Gen."],[false],[false],[false]],[["Dat."],[false],[false],[false]]]],
        ["strong adjective", "ykkarr", "you'all two's", [["ykkarr","ykkarn","ykkars","ykkurum","ykkarir","ykkara","ykkara","ykkurum"],["ykkur","ykkara","ykkarar","ykkari","ykkarar","ykkarar","ykkara","ykkurum"],["ykkart","ykkart","ykkars","ykkuru","ykkur","ykkur","ykkara","ykkurum"]],[[["SG."],["Masculine"],["Feminine"],["Neuter"]],[["Nom."],[false],[false],[false]],[["Acc."],[false],[false],[false]],[["Gen."],[false],[false],[false]],[["Dat."],[false],[false],[false]],[["PL."],["Masculine"],["Feminine"],["Neuter"]],[["Nom."],[false],[false],[false]],[["Acc."],[false],[false],[false]],[["Gen."],[false],[false],[false]],[["Dat."],[false],[false],[false]]]]
    ]
    let curId = 0
    displayQuestion(0)


    
    function checkSol() {
        let wordInfo = data[curId]
        if(wordInfo.length > 6) {return}

        let wordVariations = wordInfo[3]
        let userInput = wordInfo[5]
        let mistake = false

        for(let x=0; x<wordVariations.length;x++) {
            if(Array.isArray(wordVariations[0])) {
                for(let y=0; y<wordVariations[0].length;y++) {
                    const input = userInput[x][y]
                    const correct = wordVariations[x][y]
                    const equal = chechIfEqual(correct,input)
                    console.log(x,y,equal)
                    if(!equal) {
                        mistake = true
                        document.getElementById(`input${x}:${y}`).value += " ≠ " + correct
                        userInput[x][y] += " ≠ " + correct
                    }else {
                        document.getElementById(`input${x}:${y}`).value += " ✔"
                        userInput[x][y] += " ✔"
                    }
                    document.getElementById(`input${x}:${y}`).style.color = equal ? "darkgreen" : "darkred"
                }
            }else {
                const input = userInput[x]
                const correct = wordVariations[x]
                const equal = chechIfEqual(correct,input)
                if(!equal) {
                    mistake = true
                    document.getElementById(`input${0}:${x}`).value += " ≠ " + correct
                    userInput[x] += " ≠ " + correct
                }else {
                    document.getElementById(`input${0}:${x}`).value += " ✔"
                    userInput[x] += " ✔"
                }
            }
        }
        wordInfo.push(mistake)

    }
    function chechIfEqual(correct,input) {
        const modifiedInput = input.replaceAll(" ","").toLowerCase()
        const modifiedCorrect= correct.replaceAll(" ","").toLowerCase()
        if(modifiedCorrect == modifiedInput) {return true}
        return false
    }

    //display the current question based on id
    function displayQuestion(id) {
        curId = id

        //refres any UI elements
        refreshHTML()


        let wordInfo = data[id]
        let wordVariations = wordInfo[3]
        const tablePreData = wordInfo[4]

        //display the info for the word
        document.getElementById("title").textContent = wordInfo[0]
        document.getElementById("word_translated").textContent = `${wordInfo[1]} ⇄ ${wordInfo[2]}`

        //get user input, when not existing generate the table
        let userInput = wordInfo?.[5]
        if(!userInput) {
            userInput = generateUserInputTable(wordVariations)
            wordInfo[5] = userInput
        }

        // reset the div, generate and appen the table viewer
        document.getElementById("solEnter").innerHTML = ""
        const table = generateTableViewer(tablePreData,wordVariations,userInput)
        document.getElementById("solEnter").appendChild(table) 

    }

    //refreshes the cardButtons and the progressBar
    function refreshHTML() {

        //when there card curId-1 does not exist, hide the button
        if(curId <= 0) {
            document.getElementById("ContainerCardButtonLast").style.visibility = "hidden"
        }else {
            document.getElementById("ContainerCardButtonLast").style.visibility = "visible"
        }

        //when there card curId+1 does not exist, change the button to end screen open
        if(curId+1 >= data.length) {
            document.querySelector("#ContainerCardButtonNext").textContent = "⟳";
        }else {
            document.querySelector("#ContainerCardButtonNext").textContent = ">";
        }
    }

    //generate the table html, using the structure, the variations and the previos user input
    function generateTableViewer(tablePreData,wordVariations,userInput) {
        
        let table = createElement("table",false,"ViewerTable","ViewerTable")
    
        //keeping track of the row for variations seperately
        let displayRowCount = -1

        //looping through the preData 
        for(let tableRow=0; tableRow<tablePreData.length; tableRow++) {

            const row = tablePreData[tableRow]
            const rowHTML = createElement("tr",false,`ViewerTableRow${tableRow}`,"ViewerTableRow")

            //keeping track of the col for variations seperately
            let displayColCount = 0
            for(let tableCol=0; tableCol<row.length; tableCol++) {

                const [cell,color] = row[tableCol]
                const cellHTML = createElement("td",false,`ViewerTableCell${tableRow}:${tableCol}`,"ViewerTableCell")
                if(color) {cellHTML.style.background = color}

                //when cell content display it otherways take the word variation
                if(cell) {
                    cellHTML.classList.add("PreDefinedCell")
                    cellHTML.textContent = cell
                }else {
                    //change the varaition row when  this is a new row
                    if(displayColCount==0) {displayRowCount+=1}
                
                    //create the input for the cell
                    const inputHtml = createElement("input",false,`input${displayColCount}:${displayRowCount}`,"inputCell")

                    //getting the correct variation and user input, based on data structure
                    const wordVariation = Array.isArray(wordVariations[0]) ? wordVariations[displayColCount][displayRowCount] : wordVariations[displayRowCount]
                    const userWordInput = Array.isArray(userInput[0]) ? userInput[displayColCount][displayRowCount] : userInput[displayRowCount]

                    inputHtml.value = userWordInput 
        
                    //when there was previosly a wrong input color the text red, if it was right green otherwise basic black
                    if(inputHtml.value.includes("≠")) {
                        inputHtml.style.color = "darkred"
                    }else if(inputHtml.value.includes("✔")) {
                        inputHtml.style.color = "darkgreen"
                    }
                    
                    // saving the current indexes so they wont get overwritten on the next loop
                    const currentDisplayColCount = displayColCount;
                    const currentDisplayRowCount = displayRowCount;
                    //on any change save the user input
                    inputHtml.addEventListener("change",()=> {
                        if(Array.isArray(userInput[0])) {
                            userInput[currentDisplayColCount][currentDisplayRowCount] = inputHtml.value 
                        }else {
                            userInput[currentDisplayColCount] = inputHtml.value 
                        } 
                    })
                    
                    //add the corrrect tags append it to the table
                    cellHTML.classList.add("viewerCell")
                    cellHTML.appendChild(inputHtml)
                    displayColCount += 1
                }

                rowHTML.appendChild(cellHTML)
            }
            table.appendChild(rowHTML)
        }

        return table
    } 

    //generate the user input table if not existing
    function generateUserInputTable(wordVariations) {
        const userInput = []
        for(let x=0; x<wordVariations.length;x++) {
            if(Array.isArray(wordVariations[0])) {
                let col = []
                for(let y=0; y<wordVariations[0].length;y++) {
                    col.push("")
                }
                userInput.push(col)
            }else {
                userInput.push("")
            }
        }
        return userInput
    }

    //create an element
    function createElement(type,text,id,classList,parentID=false) {
        const element = document.createElement(type)
        if(text){element.textContent = text}
        if(id){element.id = id}
        if(classList){element.classList = classList}
        if(parentID){document.getElementById(parentID).appendChild(element)}
        return element
    }

</script>
</body>
</html>
