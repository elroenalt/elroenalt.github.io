<!DOCTYPE html>
<html>
<head>
    
<title>Voc Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>ᛋ</text></svg>">

<link rel="stylesheet" type="text/css" href="../main.css">
<link rel="stylesheet" type="text/css" href="main.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0"></head>

</head>
<body>
<div id="Background">
</div>
<div id="Forground">
    <div class="container" id="Container">
        <div class="display"id="ContainerInfo">
            VOC CARDS
        </div>
        <div class="display"id="ContainerMain">
        </div>
    </div>
    <div class="container" id="ContainerViewer">
        <div id="closeButton" class="button" onclick="document.getElementById('ContainerViewer').style.display = 'none'; 
            window.location.hash = ''">X</div>
            <div class="title" id="ViwerContainerTitle" onclick="openGrammarHTML()">
            </div>
            <div class="title" id="ViwerContainerwordAndTranslate">
            </div>
            <div class="container" id="ViwerContainerInfo">
            </div>
    </div>
</div>
<script>

    const allVariationFileTypes = ["weak_noun","strong_noun","pronoun","weak_verb","strong_verb","weak_adjective","strong_adjective","determiner"]
    const loaded_files = {}
    let [curWord,curType] = [NaN,NaN]

    //based on what datapoint to sort
    let sorting_type = 1

    //on title click open the grammar page to the current type
    function openGrammarHTML() {
        if(!curType) {return}
        const link = '../grammar_viewer/#' + curType
        window.open(link, "_blank")
    }

    // load the Viewer using word Data out of respective file
    async function loadViewerWord(wordData) {
        const type = wordData[0].split(",")[0].trim().replaceAll(" ","_")
        const file = `${type}_questions`
        curType = type
        console.log(type)
        const hasVariations = allVariationFileTypes.includes(type)
        console.log(hasVariations)

        //displaying title
        const Title = document.getElementById("ViwerContainerTitle")
        Title.textContent = wordData[0]

        //displaying cur Word and its translation
        const wordAndTranslate = document.getElementById("ViwerContainerwordAndTranslate")
        wordAndTranslate.textContent = `${wordData[1]} ⇔ ${wordData[2]}`

        //emptying the container for the table
        const container = document.getElementById("ViwerContainerInfo")
        container.textContent = ""

        //only display the table if variation exists
        if(hasVariations) {
            const tablePreData = await getLoadedPreTableFromFile(file)
            const word = await getLoadedWordFromFile(file, wordData)

            //taking the word diffrent variations of the words and the type and getting a finished a html
            const wordInfo = word[3]
            const viewerTable = generateTableViewer(tablePreData,wordInfo)

            //appedning the table to the table container
            container.appendChild(viewerTable)

        }else {
            // if no variations are present tell the user
            container.textContent = "No Variations"
        }

        //enable the viewer
        document.getElementById('ContainerViewer').style.display = 'block';
    }

    //get the variation data out of the correct file
    async function getLoadedPreTableFromFile(file) {

        // if the file didn't get loaded yet, load it
        if(!loaded_files[file]) {
            loaded_files[file] = await loadFile(file)
        }
        const loadedFile = loaded_files[file]

        //reurn the first index of the array
        return loadedFile[0]
    }
    async function getLoadedWordFromFile(file,wordData) {

        // if the file didn't get loaded yet, load it
        if(!loaded_files[file]) {
            loaded_files[file] = await loadFile(file)
        }
        const loadedFile = loaded_files[file]

        //get the words from the second index of the array
        const loadedWords = loadedFile[1]

        //load through the file to find the word and return it
        for(const word of loadedWords) {
            if(word[0] == wordData[0] && word[1] == wordData[1]) {
                return word
            }
        }
    }

    // generating the table viewer for word Variations
    function generateTableViewer(tablePreData,wordInfo) {
        
        let table = createElement("table",false,"ViewerTable","ViewerTable")

        //keeping track of the row for variations seperately
        let displayRowCount = -1

        //looping through the preData 
        for(let tableRow=0; tableRow<tablePreData.length; tableRow++) {

            const row = tablePreData[tableRow]
            const rowHTML = createElement("tr",false,`ViewerTableRow${tableRow}`,"ViewerTableRow")

            //keeping track of the col for variations seperately
            let displayColCount = 0
            for(let tableCol=0; tableCol<row.length; tableCol++) {

                const [cell,color] = row[tableCol]
                const cellHTML = createElement("td",false,`ViewerTableCell${tableRow}:${tableCol}`,"ViewerTableCell")
                if(color) {cellHTML.style.background = color}

                //when cell content display it otherways take the word variation
                if(cell) {
                    cellHTML.classList.add("PreDefinedCell")
                    cellHTML.textContent = cell
                }else {
                    //change the varaition row when  this is a new row
                    if(displayColCount==0) {displayRowCount+=1}

                    //if the the type of the first index is an object treat it as a 2D Array otherwise as a 1D Array
                    const content = typeof wordInfo[0] == "object" ? wordInfo[displayColCount][displayRowCount] : wordInfo[displayRowCount]

                    cellHTML.classList.add("viewerCell")
                    cellHTML.textContent = content
                    displayColCount += 1
                }

                rowHTML.appendChild(cellHTML)
            }
            table.appendChild(rowHTML)
        }

        return table
    }    



    let wordList = NaN
    let alphabet = NaN

    // load files sort it by type and then name and call the row loading
    async function init(params) {
        wordList = await loadFile("words")
        alphabet = await loadFile("alphabet")
        wordList.sort((a, b) => {
            const categoryCompare = a[sorting_type].localeCompare(b[sorting_type]);
            if (categoryCompare !== 0) return categoryCompare;
            return a[1].localeCompare(b[1]);
        });

        load_rows()
    }

    // var for keeping track of row count and adding a border between types
    let rowCount = 0
    let lastRow = false

    //looping though every word and adding a row for it
    function load_rows() {

        for(let i=0; i<wordList.length;i++) {

            wordData = wordList[i]
            add_Row(wordData[0], wordData[1],wordData[2])
        }
    }

    //adding the row
    function add_Row(type,word,translated) {

        //container for the display
        const containerDIV = createElement("div",false,`row${rowCount}`,"Row","ContainerMain")

        //when this word is part of a new type, add a border
        const newRow = [type,word,translated]
        const isNewType = lastRow && (sorting_type ? (lastRow[sorting_type][0] != newRow[sorting_type][0]) : (lastRow[sorting_type] != newRow[sorting_type]))
        console.log(isNewType)
        if(isNewType) {
            containerDIV.style.borderTop = "2px solid black"
        }

        //add the lsitener to open a viewer for the word
        containerDIV.addEventListener("click", () => {
            window.location.hash = "#" + type + "/" + word + "/" + translated
            loadViewerWord([type,word,translated])
        })

        
        //display for type, word in language and its translation

        const typeDIV = createElement("div",String(type),`RowType${rowCount}`,"rowType")
        containerDIV.appendChild(typeDIV)

        const wordDIV = createElement("div",String(word),`RowWord${rowCount}`,"rowWord")
        containerDIV.appendChild(wordDIV)
        
        const translatedDIV = createElement("div",String(translated),`RowTranslated${rowCount}`,"rowTranslated")
        containerDIV.appendChild(translatedDIV)

        // preparing the scene for the next row 
        rowCount += 1
        lastRow = newRow
    }

    //loading the file by name 
    async function loadFile(file_name) {
        try {
            const response = await fetch(`../storage/oldNorse/${file_name}.json`)

            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }

            const allData = await response.json()
            return allData
        } catch (error) {
            console.error("Oops, couldn't load the JSON file:", file_name)
        }
    }

    //creating a element, with attributes to make the code more viewable
    function createElement(type,text,id,classList,parentID=false) {
        const element = document.createElement(type)
        if(text){element.textContent = text}
        if(id){element.id = id}
        if(classList){element.classList = classList}
        if(parentID){document.getElementById(parentID).appendChild(element)}
        return element
    }
    init()

    
    // get the current hash
    let currentHash = decodeURIComponent(window.location.hash.replace("#","")) 
    let [currentType,currentWord,currentTranslated] = ["","",""]
    // when the hash exists, load the viewer for that word
    if(currentHash) {
        [currentType,currentWord,currentTranslated] = currentHash.split("/")
        loadViewerWord([currentType,currentWord,currentTranslated])
    }
</script>
</body>
</html>
